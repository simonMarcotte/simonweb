<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simon m</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico?">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overscroll-behavior: none;
        }

        body {
            font-family: ui-serif, Georgia, 'Times New Roman', Times, serif;
            background: #0a0a0a;
            color: #fff;
            margin: 0;
            overflow-x: hidden;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            overscroll-behavior: none;
        }

        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
        
        .content { position: relative; z-index: 10; }
        
        .nav { position: fixed; top: 20px; right: 20px; display: flex; gap: 20px; pointer-events: auto; z-index: 20; }
        .nav a { color: #ccc; text-decoration: none; font-size: 14px; position: relative; transition: color 0.2s; pointer-events: auto; }
        .nav a:hover { color: #fff; }
        .nav a::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 1px; background: #fff; transition: width 0.2s; }
        .nav a:hover::after { width: 100%; }
        
        .header {
            height: 100vh;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        
        .header h1 {
            font-size: 5rem;
            font-weight: 300;
            text-align: center;
            text-transform: lowercase;
        }

        .section {
            padding: 80px 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 60px;
            text-align: center;
            text-transform: lowercase;
        }

        .timeline {
            position: relative;
            padding: 0;
            min-height: 100vh;
        }

        .timeline-item:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 6px;
            bottom: -80px;
            width: 2px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.5), rgba(255,255,255,0.3));
            pointer-events: none;
        }

        .timeline-item {
            margin-bottom: 80px;
            position: relative;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timeline-dot {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: #fff;
            border: 2px solid #0a0a0a;
            border-radius: 50%;
            z-index: 15;
            box-shadow: 0 0 20px rgba(255,255,255,0.6);
        }

        .item-content {
            padding: 0;
            background: transparent;
            border: none;
            width: 90%;
            max-width: 400px;
            position: relative;
            text-align: center;
        }

        .info-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            padding: 12px 16px;
            margin-top: 20px;
        }

        .logo {
            width: 60px;
            height: 60px;
            border-radius: 4px;
            background: #1a1a1a;;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 22px;
            filter: brightness(0.85) grayscale(0.15);
            padding: 1px;
            position: relative;
            z-index: 20;
        }

        .logo img {
            filter: brightness(0.85) grayscale(0.15);
            width: 100%;
            height: 100%;
            object-fit: contain;
            border: none;
            outline: none;
        }

        .job-info {
            text-align: center;
        }

        .job-info h3 {
            font-size: 1.3rem;
            font-weight: 400;
            margin: 0 0 2px 0;
            text-transform: lowercase;
        }

        .job-title {
            font-size: 1rem;
            color: #aaa;
            margin: 0;
            text-transform: lowercase;
        }

        .job-date {
            font-size: 0.8rem;
            color: #777;
            margin: 4px 0 0 0;
            text-transform: lowercase;
        }

        .job-location {
            font-size: 0.8rem;
            color: #888;
            margin: 2px 0 0 0;
            text-transform: lowercase;
        }

        .media-container {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .media-item {
            position: relative;
            display: inline-block;
            padding: 8px;
        }

        .media-item img {
            width: 120px;
            height: 120px;
            border-radius: 4px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.15);
            display: block;
        }

        .media-item a {
            display: block;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 3rem;
            }

            .section-title {
                font-size: 1.8rem;
                margin-bottom: 40px;
            }

            .timeline-item {
                margin-bottom: 70px;
            }

            .media-item img {
                width: 100px;
                height: 100px;
            }

            .section {
                padding: 50px 15px;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 30px 15px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .nav {
                top: 15px;
                right: 15px;
                gap: 12px;
                font-size: 12px;
            }

            .section {
                padding: 40px 15px;
            }

            .timeline {
                padding: 30px 0;
            }

            .timeline-item {
                margin-bottom: 80px;
                height: 150px;
            }

            .item-content {
                width: 90%;
            }

            .media-item img {
                width: 80px;
                height: 80px;
            }

            .logo {
                width: 50px;
                height: 50px;
                font-size: 18px;
            }

            .info-header {
                gap: 10px;
            }

            .job-info h3 {
                font-size: 1rem;
            }

            .job-title {
                font-size: 0.85rem;
            }
        }

        .footer {
            text-align: center;
            padding: 40px 20px 30px;
            color: #555;
            font-size: 0.75rem;
            text-transform: lowercase;
            letter-spacing: 1px;
        }

        .timeline-item .logo { cursor: grab; }
        .timeline-item.dragging .logo { cursor: grabbing; }
        .timeline-item.dragging { z-index: 100; }
        .timeline-item.resetting { transition: top 0.4s ease, left 0.4s ease; }
        .timeline.no-connectors .timeline-item::after { display: none; }

        .reset-btn {
            position: fixed;
            bottom: 30px;
            right: 20px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #888;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: color 0.2s, border-color 0.2s, opacity 0.3s;
            border-radius: 4px;
            padding: 0;
        }
        .reset-btn:hover { color: #fff; border-color: rgba(255,255,255,0.5); }
        .reset-btn.hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <button class="reset-btn hidden" id="reset-btn" onclick="resetLayout()" title="reset layout">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
        </svg>
    </button>
    <nav class="nav">
        <a href="https://linkedin.com/in/simoncmarcotte" target="_blank" rel="noopener noreferrer">linkedin</a>
        <a href="https://github.com/simonMarcotte" target="_blank" rel="noopener noreferrer">github</a>
        <a href="mailto:simonmrctt@gmail.com" target="_blank" rel="noopener noreferrer">email</a>
    </nav>

    <script src="data/profile-data.js"></script>
    
    <div class="content">
        <div class="header">
            <h1>simon marcotte</h1>
        </div>

        <section class="section" id="work">
            <h2 class="section-title">Work Experience</h2>
            <div class="timeline" id="work-timeline"></div>
        </section>

        <section class="section" id="education">
            <h2 class="section-title">Education</h2>
            <div class="timeline" id="education-timeline"></div>
        </section>

        <footer class="footer">
            created by simon m, 2026
        </footer>
    </div>

    <script>
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    let w, h, stars = [], mouse = { clientX: -1000, clientY: -1000 }, timelineNodes = [];

    // --- Drag state ---
    let dragState = null;
    let hadCardDrag = false;

    function createTimelineItem(item) {
        const el = document.createElement('div');
        el.className = 'timeline-item';
        el.innerHTML = `
            <div class="timeline-dot"></div>
            <div class="item-content">
                <div class="info-header">
                    <div class="logo">
                        <img src="${item.logo}" alt="${item.alt}" style="width:100%;height:100%;object-fit:contain;border-radius:4px;">
                    </div>
                    <div class="job-info">
                        <h3>${item.title}</h3>
                        <p class="job-title">${item.subtitle}</p>
                        <p class="job-location">${item.location}</p>
                        <p class="job-date">${item.date}</p>
                    </div>
                </div>
            </div>
        `;
        return el;
    }

    function renderTimeline(containerId, items) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        items.forEach(item => container.appendChild(createTimelineItem(item)));
    }

    function initDraggable(container) {
        const items = Array.from(container.querySelectorAll('.timeline-item'));
        const containerRect = container.getBoundingClientRect();

        // Measure ALL natural tops before pulling any item from flow (siblings shift when one goes absolute)
        const naturalTops = items.map(item => item.getBoundingClientRect().top - containerRect.top);

        container.style.height = containerRect.height + 'px';
        // Canvas draws connections now — disable the CSS ::after connector lines permanently
        container.classList.add('no-connectors');

        items.forEach((item, i) => {
            item._naturalTop  = naturalTops[i];
            item._naturalLeft = 0;

            item.style.position = 'absolute';
            item.style.margin   = '0';
            item.style.width    = '100%';
            item.style.top      = item._naturalTop + 'px';
            item.style.left     = '0';

            item.querySelector('.logo').addEventListener('pointerdown', onPointerDown);
        });
    }

    function onPointerDown(e) {
        if (e.target.tagName === 'A') return;
        e.preventDefault();

        const item = e.currentTarget.closest('.timeline-item');
        const itemRect = item.getBoundingClientRect();

        dragState = {
            item,
            container: item.closest('.timeline'),
            offsetX: e.clientX - itemRect.left,
            offsetY: e.clientY - itemRect.top
        };

        item.classList.add('dragging');
        item.setPointerCapture(e.pointerId);
        hadCardDrag = false;

        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp, { once: true });
    }

    function onPointerMove(e) {
        if (!dragState) return;
        hadCardDrag = true;

        mouse.clientX = e.clientX;
        mouse.clientY = e.clientY;

        const { item, container, offsetX, offsetY } = dragState;
        const cr = container.getBoundingClientRect();

        item.style.left = (e.clientX - cr.left - offsetX) + 'px';
        item.style.top  = (e.clientY - cr.top  - offsetY) + 'px';

        container.classList.add('no-connectors');
        getTimelineNodes();
    }

    function onPointerUp() {
        if (!dragState) return;
        dragState.item.classList.remove('dragging');
        dragState = null;
        document.removeEventListener('pointermove', onPointerMove);
        getTimelineNodes();
        if (hadCardDrag) showResetBtn();
    }

    function resetLayout() {
        document.querySelectorAll('.timeline-item').forEach(item => {
            item.classList.add('resetting');
            item.style.top  = item._naturalTop  + 'px';
            item.style.left = item._naturalLeft + 'px';
            setTimeout(() => item.classList.remove('resetting'), 450);
        });
        hideResetBtn();
        setTimeout(getTimelineNodes, 50);
    }

    function showResetBtn() { document.getElementById('reset-btn').classList.remove('hidden'); }
    function hideResetBtn() { document.getElementById('reset-btn').classList.add('hidden'); }

    function loadTimelineData() {
        const data = window.profileData;
        if (!data) { console.error('Timeline data is not available.'); return; }

        renderTimeline('work-timeline', data.work || []);
        renderTimeline('education-timeline', data.education || []);

        setTimeout(() => {
            ['work-timeline', 'education-timeline'].forEach(id => {
                const el = document.getElementById(id);
                if (el) initDraggable(el);
            });
            getTimelineNodes();
            resize();
        }, 150);
    }

    function getTimelineNodes() {
        timelineNodes = { work: [], education: [] };

        document.querySelectorAll('#work .timeline-dot').forEach(dot => {
            const rect = dot.getBoundingClientRect();
            timelineNodes.work.push({ x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 + window.scrollY });
        });

        document.querySelectorAll('#education .timeline-dot').forEach(dot => {
            const rect = dot.getBoundingClientRect();
            timelineNodes.education.push({ x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 + window.scrollY });
        });
    }

    function resize() {
        w = innerWidth;
        h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight, innerHeight);
        c.width = w;
        c.height = h;

        if (stars.length === 0) {
            const numStars = Math.ceil(80 * (h / innerHeight));
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    brightness: Math.random() * 0.5 + 0.2,
                    twinkle: Math.random() * 0.008 + 0.004
                });
            }
        }

        getTimelineNodes();
    }
    setTimeout(resize, 100);

    let resizeTimeout;
    addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            w = innerWidth;
            h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight, innerHeight);
            c.width = w;
            c.height = h;
            stars.forEach(star => {
                if (star.x > w) star.x = Math.random() * w;
                if (star.y > h) star.y = Math.random() * h;
            });
            getTimelineNodes();
        }, 100);
    });
    addEventListener('load', loadTimelineData);

    addEventListener('mousemove', e => { mouse.clientX = e.clientX; mouse.clientY = e.clientY; });

    // Mobile: only track finger position for the star hover effect — no tap-to-spawn
    addEventListener('touchstart', e => {
        const t = e.touches[0];
        mouse.clientX = t.clientX; mouse.clientY = t.clientY;
    }, { passive: true });
    addEventListener('touchmove', e => {
        const t = e.touches[0];
        mouse.clientX = t.clientX; mouse.clientY = t.clientY;
    }, { passive: true });
    addEventListener('touchend', () => {
        mouse.clientX = -1000; mouse.clientY = -1000;
    }, { passive: true });

    addEventListener('click', e => {
        if (e.target.tagName === 'A') return;
        if (hadCardDrag) { hadCardDrag = false; return; }
        stars.push({ x: e.clientX, y: e.clientY + window.scrollY, brightness: 0.8, twinkle: Math.random() * 0.008 + 0.004 });
    });

    function animate() {
        // Refresh every frame so lines follow cards during CSS transitions and drags
        getTimelineNodes();

        ctx.clearRect(0, 0, w, h);

        const mouseX = mouse.clientX + window.scrollX;
        const mouseY = mouse.clientY + window.scrollY;

        // Draw persistent connections between timeline dots
        ['work', 'education'].forEach(key => {
            const nodes = timelineNodes[key] || [];
            for (let i = 0; i < nodes.length - 1; i++) {
                const a = nodes[i], b = nodes[i + 1];
                ctx.strokeStyle = 'rgba(255,255,255,0.45)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
            }
        });

        stars.forEach((star, i) => {
            const dx = mouseX - star.x, dy = mouseY - star.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            let displayBrightness = star.brightness;
            star.brightness += star.twinkle;
            if (star.brightness > 0.8 || star.brightness < 0.2) star.twinkle *= -1;

            if (dist < 250) {
                displayBrightness = Math.min(1.0, star.brightness + (250 - dist) / 250 * 0.3);
                ctx.strokeStyle = `rgba(255,255,255,${(250 - dist) / 250 * 0.6})`;
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(star.x, star.y); ctx.lineTo(mouseX, mouseY); ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(star.x, star.y, 1.5, 0, 6.28);
            ctx.fillStyle = `rgba(255,255,255,${displayBrightness})`;
            ctx.fill();

            for (let j = i + 1; j < stars.length; j++) {
                const o = stars[j];
                const d2 = Math.sqrt((star.x - o.x) ** 2 + (star.y - o.y) ** 2);
                if (d2 < 120) {
                    ctx.strokeStyle = `rgba(255,255,255,${(120 - d2) / 120 * 0.3})`;
                    ctx.lineWidth = 0.5;
                    ctx.beginPath(); ctx.moveTo(star.x, star.y); ctx.lineTo(o.x, o.y); ctx.stroke();
                }
            }
        });

        // Scroll-down arrow indicator — fades out as you leave the header
        const scrollFade = Math.max(0, 1 - window.scrollY / (innerHeight * 0.25));
        if (scrollFade > 0) {
            const t = Date.now();
            const pulse = 0.45 + 0.3 * Math.sin(t / 700);
            const bob = Math.sin(t / 900) * 4;
            const cx = innerWidth / 2;
            const by = window.scrollY + innerHeight - 52 + bob;
            const alpha = scrollFade * pulse;

            const chevrons = [
                [[-18, -13], [-9, -6], [0, 0], [9, -6], [18, -13]],
                [[-18, -25], [-9, -18], [0, -12], [9, -18], [18, -25]],
            ];

            chevrons.forEach(pts => {
                ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.45})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                pts.forEach(([dx, dy], i) => {
                    i === 0 ? ctx.moveTo(cx + dx, by + dy) : ctx.lineTo(cx + dx, by + dy);
                });
                ctx.stroke();

                pts.forEach(([dx, dy]) => {
                    ctx.beginPath();
                    ctx.arc(cx + dx, by + dy, 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                    ctx.fill();
                });
            });
        }

        requestAnimationFrame(animate);
    }
    animate();
    </script>
</body>
</html>
